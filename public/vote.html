<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Vote — Ask the Audience</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { display: flex; flex-direction: column; padding: 18px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .wrap { max-width: 480px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; }
    .brand { text-align: center; color: var(--gold); font-weight: 800; font-size: 22px; letter-spacing: 1px; margin-top: 8px; }
    .sub { text-align: center; color: var(--muted-2); font-size: 12px; text-transform: uppercase; letter-spacing: 3px; margin: 4px 0 18px; }
    .qbox { background: linear-gradient(180deg, #0a3522, #03160e); border: 2px solid var(--rim); border-radius: 14px; padding: 18px; text-align: center; font-size: 19px; line-height: 1.35; margin-bottom: 16px; }
    .opts { display: flex; flex-direction: column; gap: 12px; }
    .opt {
      justify-content: flex-start; gap: 14px; white-space: normal; text-align: left;
      padding: 16px 18px; border-radius: 14px; font-size: 18px; font-weight: 600;
      border: 2px solid var(--rim); background: linear-gradient(180deg, #0a3522, #03160e);
      -webkit-tap-highlight-color: transparent; min-height: 60px;
    }
    .opt:hover:not(:disabled) { background: linear-gradient(180deg, #0d4a30, #052a1b); }
    .opt .letter { color: var(--gold); font-weight: 800; min-width: 1.3em; }
    .opt.chosen { background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--gold-deep)); border-color: #fff; }
    .opt.chosen:hover:not(:disabled) { background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--gold-deep)); }
    .opt.chosen .letter, .opt.chosen .text { color: var(--ink-on-gold); }
    .opt.chosen::after { content: '✓'; margin-left: auto; color: var(--ink-on-gold); font-weight: 900; }
    .status { text-align: center; margin-top: 20px; font-size: 15px; color: var(--muted); min-height: 24px; }
    .status.live { color: var(--green); font-weight: 700; }
    .waiting { text-align: center; padding: 40px 16px; color: var(--muted); line-height: 1.5; }
    .waiting .big { font-size: 24px; color: var(--gold); margin-bottom: 10px; font-weight: 800; }
    .waiting .dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    .foot { text-align: center; color: #4f8a6d; font-size: 12px; margin-top: auto; padding-top: 18px; }
  </style>
</head>
<body>
  <div class="sunburst"></div>
  <div class="connection" id="conn">● connecting…</div>
  <div class="wrap">
    <div class="brand">💰 Ask the Audience</div>
    <div class="sub">Million Dollar Question</div>

    <div id="liveView" class="hidden">
      <div class="qbox" id="qbox"></div>
      <div class="opts" id="opts" role="group" aria-label="Answers"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div class="waiting" id="waitView">
      <div class="big">Hang tight!</div>
      <div>When the contestant asks the audience, the question will pop up here<span class="dots"></span></div>
    </div>

    <div class="foot">Keep this page open — it updates by itself. Your vote is anonymous.</div>
  </div>

  <script src="/common.js"></script>
  <script>
    // Stable per-phone id so re-tapping changes the vote instead of adding one.
    let voterId = storage('get', 'mq_voter_id');
    if (!voterId) {
      voterId = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      storage('set', 'mq_voter_id', voterId);
    }

    let myChoice = null;
    let roundKey = '';
    let current = null;

    function renderOptions() {
      const s = current;
      $('opts').innerHTML = '';
      s.answers.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt' + (myChoice === i ? ' chosen' : '');
        btn.disabled = s.removed.includes(i);
        btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="text">${escapeHtml(text)}</span>`;
        btn.onclick = () => castVote(i);
        $('opts').appendChild(btn);
      });
      const status = $('status');
      if (myChoice === null) {
        status.textContent = `Voting is open — tap your answer! (${s.total} in)`;
        status.classList.remove('live');
      } else {
        status.textContent = `You voted ${LETTERS[myChoice]} ✓ · tap another to change (${s.total} in)`;
        status.classList.add('live');
      }
    }

    async function castVote(i) {
      if (!current || !current.open) return;
      const before = myChoice;
      myChoice = i;
      renderOptions();
      if (navigator.vibrate) navigator.vibrate(30);
      try {
        const res = await fetch('/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voterId, choice: i }),
        });
        const body = await res.json();
        if (!body.ok) throw new Error(body.error);
      } catch (err) {
        myChoice = before;
        renderOptions();
        toast(err.message && err.message !== 'Failed to fetch' ? err.message : 'Network hiccup — tap again', 'error');
      }
    }

    Game.onState((s) => {
      current = s;
      const key = `${s.questionNumber}|${s.question}`;
      if (key !== roundKey) { roundKey = key; myChoice = null; }
      $('liveView').classList.toggle('hidden', !s.open);
      $('waitView').classList.toggle('hidden', s.open);
      if (!s.open) return;
      $('qbox').textContent = s.question;
      renderOptions();
    });
    Game.connect('audience');
  </script>
</body>
</html>
