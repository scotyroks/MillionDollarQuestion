<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Millionaire — Contestant Screen</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .stage { display: grid; grid-template-columns: 1fr 220px; height: 100vh; padding: 20px; gap: 18px; }
    .main { display: flex; flex-direction: column; }
    .top { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 30px; }
    .play-area { width: 100%; display: flex; flex-direction: column; gap: 18px; margin-top: auto; }
    .side { display: flex; flex-direction: column; }
    .lifelines { justify-content: center; margin-bottom: 14px; }
    .intro { text-align: center; }
    .intro .logo { font-size: clamp(34px, 6vw, 72px); font-weight: 800; color: var(--gold); text-shadow: 0 0 30px rgba(244,196,48,0.6); line-height: 1.1; }
    .intro .sub { color: #9fb4e8; margin-top: 14px; letter-spacing: 3px; text-transform: uppercase; font-size: 14px; }
    .audience-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(2,3,15,0.9); z-index: 40; }
    .audience-overlay.show { display: flex; }
    .audience-panel { text-align: center; }
    .audience-panel h2 { color: var(--gold); margin-bottom: 24px; }
    .phone-timer { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(2,3,15,0.9); z-index: 41; }
    .phone-timer.show { display: flex; }
    .phone-timer .count { font-size: 26vh; font-weight: 800; color: var(--gold); text-shadow: 0 0 40px rgba(244,196,48,0.6); }
    .phone-timer .lbl { letter-spacing: 4px; text-transform: uppercase; color: #9fb4e8; }
  </style>
</head>
<body>
  <div class="connection" id="conn">● connecting…</div>

  <div class="stage">
    <div class="main">
      <div class="top">
        <div class="intro" id="intro">
          <div class="logo">Who Wants<br/>To Be A Millionaire</div>
          <div class="sub">Game Night</div>
        </div>
        <div class="play-area" id="playArea" style="display:none;">
          <div class="lifelines" id="lifelines"></div>
          <div class="question-box" id="questionBox"></div>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <ul class="ladder" id="ladder"></ul>
    </div>
  </div>

  <!-- Audience overlay -->
  <div class="audience-overlay" id="audienceOverlay">
    <div class="audience-panel">
      <h2>Ask the Audience</h2>
      <div class="audience-chart" id="audienceChart"></div>
    </div>
  </div>

  <!-- Phone timer -->
  <div class="phone-timer" id="phoneTimer">
    <div class="lbl">Phone a Friend</div>
    <div class="count" id="phoneCount">30</div>
  </div>

  <!-- Result banner -->
  <div class="banner" id="banner">
    <h1 id="bannerTitle"></h1>
    <div class="amount" id="bannerAmount"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/display.js"></script>
</body>
</html>
