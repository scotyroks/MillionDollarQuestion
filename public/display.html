<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Million Dollar Question — Contestant Screen</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .stage { position: relative; display: grid; grid-template-columns: 1fr 230px; height: 100vh; padding: 20px; gap: 18px; z-index: 1; }
    .main { display: flex; flex-direction: column; position: relative; z-index: 1; }
    .top { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 30px; }
    .play-area { width: 100%; display: flex; flex-direction: column; gap: 18px; margin-top: auto; }
    .side { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
    .lifelines { justify-content: center; margin-bottom: 14px; }

    /* Intro / logo */
    .intro { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .intro .brand-logo img { max-height: 64vh; }
    .intro .brand-logo .logo-fallback { font-size: clamp(40px, 8vw, 110px); }
    .intro .brand-logo .logo-fallback .l3 { font-size: 0.82em; }
    .intro .sub { color: var(--gold-soft); letter-spacing: 6px; text-transform: uppercase; font-size: clamp(12px, 1.4vw, 16px); }
    .intro-glow { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { filter: drop-shadow(0 0 18px rgba(244,196,48,0.25)); } 50% { filter: drop-shadow(0 0 40px rgba(244,196,48,0.55)); } }

    /* small corner logo during play */
    .corner-logo { position: fixed; top: 14px; left: 18px; z-index: 5; opacity: 0.9; }
    .corner-logo img { height: 56px; width: auto; }
    .corner-logo .logo-fallback { font-size: 16px; line-height: 0.95; text-align: left; }

    .audience-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.92); z-index: 40; }
    .audience-overlay.show { display: flex; }
    .audience-panel { text-align: center; }
    .audience-panel h2 { color: var(--gold); margin-bottom: 24px; letter-spacing: 1px; }
    .phone-timer { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.92); z-index: 41; }
    .phone-timer.show { display: flex; }
    .phone-timer .count { font-size: 26vh; font-weight: 900; color: var(--gold); text-shadow: 0 0 50px rgba(244,196,48,0.7); }
    .phone-timer .lbl { letter-spacing: 5px; text-transform: uppercase; color: var(--gold-soft); }
  </style>
</head>
<body>
  <div class="sunburst"></div>
  <div class="connection" id="conn">● connecting…</div>

  <!-- Small logo shown in the corner during play -->
  <div class="corner-logo" id="cornerLogo" style="display:none;">
    <span class="brand-logo">
      <img src="/logo.png" alt="Million Dollar Question" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
      <span class="logo-fallback" style="display:none;"><span class="l1">MILLION</span> <span class="l2">DOLLAR</span> <span class="l3">QUESTION</span></span>
    </span>
  </div>

  <div class="stage">
    <div class="main">
      <div class="top">
        <div class="intro" id="intro">
          <span class="brand-logo intro-glow">
            <img src="/logo.png" alt="Million Dollar Question" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
            <span class="logo-fallback" style="display:none;">
              <span class="l1">MILLION</span><br/><span class="l2">DOLLAR</span><br/><span class="l3">QUESTION</span>
            </span>
          </span>
          <div class="sub">Game Night</div>
        </div>
        <div class="play-area" id="playArea" style="display:none;">
          <div class="lifelines" id="lifelines"></div>
          <div class="question-box" id="questionBox"></div>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <ul class="ladder" id="ladder"></ul>
    </div>
  </div>

  <!-- Audience overlay -->
  <div class="audience-overlay" id="audienceOverlay">
    <div class="audience-panel">
      <h2>Ask the Audience</h2>
      <div class="audience-chart" id="audienceChart"></div>
    </div>
  </div>

  <!-- Phone timer -->
  <div class="phone-timer" id="phoneTimer">
    <div class="lbl">Phone a Friend</div>
    <div class="count" id="phoneCount">30</div>
  </div>

  <!-- Result banner -->
  <div class="banner" id="banner">
    <h1 id="bannerTitle"></h1>
    <div class="amount" id="bannerAmount"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/display.js"></script>
</body>
</html>
